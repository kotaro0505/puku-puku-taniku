workflows:
  ios-testflight: &ios-production-workflow
    name: ぷくぷく！たにくらいふ iOS TestFlight（Googleテスト広告）
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ohanayanouen.pukupukutaniku
      vars:
        GODOT_VERSION: "4.7.2"
        GODOT_TEMPLATE_VERSION: "4.7.2.stable"
        STOREKIT2_VERSION: "v0.2"
        IOS_MIN_VERSION: "15.6"
        STOREKIT2_COMPAT_REVISION: "compat2"
        ADMOB_PLUGIN_VERSION: "v7.0"
        ADMOB_PLUGIN_UPSTREAM_COMMIT: "4b4ddceab0be81f0dcb12a6313038dba6cf9eacf"
        ADMOB_NATIVE_COMPAT_REVISION: "ump1"
        GOOGLE_MOBILE_ADS_VERSION: "12.14.0"
        APP_VERSION: "1.0.0"
        APPLE_TEAM_ID: "UK8FRB9XKH"
        BUNDLE_ID: "com.ohanayanouen.pukupukutaniku"
        BUILD_PROFILE: "app_store"
        MOBILE_ADS_MODE: "test"
        GODOT_IOS_PRESET: "iOS"
        DISPLAY_NAME: "ぷくぷく！たにくらいふ"
        IOS_APP_DIR: "build/ios/puku_puku_taniku"
        IOS_INFO_PLIST: "build/ios/puku_puku_taniku/puku_puku_taniku-Info.plist"
        IPA_DIR: "build/ios/ipa"
        INTERNAL_TESTFLIGHT_ONLY: "true"
        APP_STORE_SUBMISSION: "false"
        XCODE_PROJECT: "build/ios/puku_puku_taniku.xcodeproj"
        XCODE_SCHEME: "puku_puku_taniku"
      xcode: 26.5
    cache:
      cache_paths:
        - $HOME/.cache/puku-puku-taniku/godot-4.7.2
        - $HOME/.cache/puku-puku-taniku/storekit2-v0.2-godot-4.7.2-ios15.6-compat2
        - $HOME/.cache/puku-puku-taniku/admob-v7.0-ump1-godot-4.7.2-gma-12.14.0-ios15.6
        - $HOME/Library/Application Support/Godot/export_templates/4.7.2.stable
    scripts:
      - name: Report checked-out source revision
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "CODEMAGIC_SOURCE_HEAD=$(git rev-parse HEAD)"
          git status --short --branch
          git log -1 --oneline

      - name: Validate iOS release configuration
        script: |
          #!/bin/bash
          set -euo pipefail
          python3 scripts/ci/validate_build_profile.py "$BUILD_PROFILE"
          python3 scripts/ci/validate_ios_export_smoke.py
          if [ "$BUILD_PROFILE" = "app_store" ]; then
            test "$BUNDLE_ID" = "com.ohanayanouen.pukupukutaniku"
          else
            test "$BUILD_PROFILE" = "development"
            test "$BUNDLE_ID" = "com.ohanayanouen.pukupukutaniku.dev"
          fi
          test "$APPLE_TEAM_ID" = "UK8FRB9XKH"
          test "$APP_VERSION" = "1.0.0"
          test "$IOS_MIN_VERSION" = "15.6"
          test "$STOREKIT2_COMPAT_REVISION" = "compat2"
          test "$ADMOB_PLUGIN_VERSION" = "v7.0"
          test "$ADMOB_PLUGIN_UPSTREAM_COMMIT" = "4b4ddceab0be81f0dcb12a6313038dba6cf9eacf"
          test "$ADMOB_NATIVE_COMPAT_REVISION" = "ump1"
          test "$GOOGLE_MOBILE_ADS_VERSION" = "12.14.0"
          if [ "$APP_STORE_SUBMISSION" = "true" ]; then
            test "$BUILD_PROFILE" = "app_store"
            test "$INTERNAL_TESTFLIGHT_ONLY" = "false"
            test "$MOBILE_ADS_MODE" = "production"
          elif [ "$INTERNAL_TESTFLIGHT_ONLY" = "true" ]; then
            test "$BUILD_PROFILE" = "app_store"
            test "$MOBILE_ADS_MODE" = "test"
          else
            test "$BUILD_PROFILE" = "development"
            test "$MOBILE_ADS_MODE" = "test"
          fi
          grep -Fq 'application/bundle_identifier="com.ohanayanouen.pukupukutaniku"' export_presets.cfg
          grep -Fq 'application/app_store_team_id="UK8FRB9XKH"' export_presets.cfg
          grep -Fq 'application/targeted_device_family=0' export_presets.cfg
          grep -Fq 'application/min_ios_version="15.6"' export_presets.cfg
          grep -Fq 'entitlements/game_center=false' export_presets.cfg
          grep -Fq 'entitlements/push_notifications="Disabled"' export_presets.cfg
          grep -Fq 'plugins/SharePlugin=true' export_presets.cfg
          grep -Fq 'plugins/NotificationSchedulerPlugin=true' export_presets.cfg
          grep -Fq 'plugins/godot-storekit2=true' export_presets.cfg
          grep -Fq 'plugins/AdmobPlugin=true' export_presets.cfg
          test -f ios/plugins/SharePlugin.gdip
          test -f ios/plugins/NotificationSchedulerPlugin.gdip
          test -f ios/plugins/SharePlugin.release.xcframework/ios-arm64/SharePlugin.a
          test -f ios/plugins/NotificationSchedulerPlugin.release.xcframework/ios-arm64/NotificationSchedulerPlugin.a
          test -f ios/plugins/AdmobPlugin.gdip
          test -f ios/plugins/AdmobPlugin.release.xcframework/ios-arm64/AdmobPlugin.a
          test -f addons/AdmobPlugin/LICENSE.txt
          test -f addons/AdmobPlugin/VENDORED_VERSION.md
          test -f scripts/ci/build_admob_plugin.sh
          test -f scripts/ci/patch_admob_ump_native.py
          grep -Fq 'version="7.0"' addons/AdmobPlugin/plugin.cfg
          grep -Fq 'GoogleMobileAds' addons/AdmobPlugin/AdmobPlugin.gd
          grep -Fq '12.14.0' addons/AdmobPlugin/AdmobPlugin.gd
          grep -Fq 'presentPrivacyOptionsFormFromViewController' scripts/ci/patch_admob_ump_native.py
          grep -Fq 'UMPConsentInformation.sharedInstance.canRequestAds' scripts/ci/patch_admob_ump_native.py
          grep -Fq 'UMPConsentInformation.sharedInstance.privacyOptionsRequirementStatus' scripts/ci/patch_admob_ump_native.py
          grep -Fq 'NSAllowsArbitraryLoadsForMedia' addons/AdmobPlugin/AdmobPlugin.gd
          grep -Fq 'NSAllowsArbitraryLoadsInWebContent' addons/AdmobPlugin/AdmobPlugin.gd
          ! grep -Fq '<key>NSAllowsArbitraryLoads</key>' addons/AdmobPlugin/AdmobPlugin.gd
          grep -Fq 'initialization="share_plugin_init"' ios/plugins/SharePlugin.gdip
          SHARE_PLUGIN_STRINGS="$(mktemp)"
          strings ios/plugins/SharePlugin.release.xcframework/ios-arm64/SharePlugin.a > "$SHARE_PLUGIN_STRINGS"
          grep -Fq 'SharePlugin::share' "$SHARE_PLUGIN_STRINGS"
          grep -Fq 'UIActivityViewController' "$SHARE_PLUGIN_STRINGS"
          grep -Fq 'share_completed' "$SHARE_PLUGIN_STRINGS"
          grep -Fq 'share_canceled' "$SHARE_PLUGIN_STRINGS"
          grep -Fq 'share_failed' "$SHARE_PLUGIN_STRINGS"
          rm -f "$SHARE_PLUGIN_STRINGS"
          test -f scripts/ci/build_storekit2_plugin.sh
          grep -Fq 'core/variant/type_info.h' scripts/ci/build_storekit2_plugin.sh
          grep -Fq 'VARIANT_ENUM_CAST' scripts/ci/build_storekit2_plugin.sh
          test -f ios/plugins/GodotStoreKit2-LICENSE.txt
          grep -Fq 'textures/vram_compression/import_etc2_astc=true' project.godot
          python3 - <<'PY'
          import struct
          from pathlib import Path

          icon = Path("assets/ios/app-icon-1024.png")
          data = icon.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("iOS icon is not PNG")
          width, height, bit_depth, color_type = struct.unpack(">IIBB", data[16:26])
          if (width, height) != (1024, 1024):
              raise SystemExit(f"iOS icon must be 1024x1024, got {width}x{height}")
          if color_type not in (0, 2):
              raise SystemExit(f"iOS icon must be opaque, PNG color type is {color_type}")
          print(f"IOS_ICON_OK size={width}x{height} bit_depth={bit_depth} opaque=true")
          PY

      - name: Configure rewarded ads without committing identifiers
        script: |
          #!/bin/bash
          set -euo pipefail
          python3 scripts/ci/configure_mobile_ads.py "$MOBILE_ADS_MODE"
          test -f addons/AdmobPlugin/ios_export.cfg
          test -f data/mobile-ads.cfg
          grep -Fxq 'att_enabled=false' addons/AdmobPlugin/ios_export.cfg
          grep -Fxq 'att_text=""' addons/AdmobPlugin/ios_export.cfg
          if [ "$MOBILE_ADS_MODE" = "production" ]; then
            grep -Fq 'is_real=true' addons/AdmobPlugin/ios_export.cfg
            ! grep -Fq 'ca-app-pub-3940256099942544/1712485313' data/mobile-ads.cfg
            grep -Fxq 'mode="production"' data/mobile-ads.cfg
          else
            grep -Fq 'is_real=false' addons/AdmobPlugin/ios_export.cfg
            grep -Fxq 'mode="test"' data/mobile-ads.cfg
            grep -Fq 'ca-app-pub-3940256099942544/1712485313' data/mobile-ads.cfg
          fi

      - name: Verify Apple toolchain meets current upload minimum
        script: |
          #!/bin/bash
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test "$XCODE_MAJOR" -ge 26
          test "$IOS_SDK_MAJOR" -ge 26
          echo "APPLE_TOOLCHAIN_OK xcode_major=$XCODE_MAJOR iphoneos_sdk=$IOS_SDK_VERSION"

      - name: Install Godot 4.7.2 and matching iOS export template
        script: |
          #!/bin/bash
          set -euo pipefail
          GODOT_CACHE="$HOME/.cache/puku-puku-taniku/godot-$GODOT_VERSION"
          GODOT_APP="$GODOT_CACHE/Godot.app"
          GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TEMPLATE_VERSION"
          RELEASE_BASE="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          MAC_ARCHIVE="Godot_v$GODOT_VERSION-stable_macos.universal.zip"
          TEMPLATE_ARCHIVE="Godot_v$GODOT_VERSION-stable_export_templates.tpz"

          mkdir -p "$GODOT_CACHE" "$TEMPLATE_DIR"
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 3 --output "$GODOT_CACHE/$MAC_ARCHIVE" "$RELEASE_BASE/$MAC_ARCHIVE"
            curl --fail --location --retry 3 --output "$GODOT_CACHE/SHA512-SUMS.txt" "$RELEASE_BASE/SHA512-SUMS.txt"
            grep "  $MAC_ARCHIVE\$" "$GODOT_CACHE/SHA512-SUMS.txt" > "$GODOT_CACHE/mac.sha512"
            (cd "$GODOT_CACHE" && shasum -a 512 -c mac.sha512)
            ditto -x -k "$GODOT_CACHE/$MAC_ARCHIVE" "$GODOT_CACHE"
          fi

          if [ ! -f "$TEMPLATE_DIR/ios.zip" ] || [ ! -f "$TEMPLATE_DIR/version.txt" ]; then
            TEMP_TEMPLATE_DIR="$(mktemp -d)"
            curl --fail --location --retry 3 --output "$TEMP_TEMPLATE_DIR/$TEMPLATE_ARCHIVE" "$RELEASE_BASE/$TEMPLATE_ARCHIVE"
            curl --fail --location --retry 3 --output "$TEMP_TEMPLATE_DIR/SHA512-SUMS.txt" "$RELEASE_BASE/SHA512-SUMS.txt"
            grep "  $TEMPLATE_ARCHIVE\$" "$TEMP_TEMPLATE_DIR/SHA512-SUMS.txt" > "$TEMP_TEMPLATE_DIR/templates.sha512"
            (cd "$TEMP_TEMPLATE_DIR" && shasum -a 512 -c templates.sha512)
            unzip -j "$TEMP_TEMPLATE_DIR/$TEMPLATE_ARCHIVE" templates/ios.zip templates/version.txt -d "$TEMPLATE_DIR"
          fi

          ACTUAL_GODOT_VERSION="$("$GODOT_BIN" --version)"
          case "$ACTUAL_GODOT_VERSION" in
            "$GODOT_VERSION.stable.official."*) ;;
            *) echo "Unexpected Godot version: $ACTUAL_GODOT_VERSION" >&2; exit 1 ;;
          esac
          test "$(cat "$TEMPLATE_DIR/version.txt")" = "$GODOT_TEMPLATE_VERSION"
          test -f "$TEMPLATE_DIR/ios.zip"
          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"
          echo "GODOT_IOS_TEMPLATE=$TEMPLATE_DIR/ios.zip" >> "$CM_ENV"
          echo "GODOT_VERSION_OK editor=$ACTUAL_GODOT_VERSION templates=$(cat "$TEMPLATE_DIR/version.txt")"

      - name: Build AdMob v7 native UMP privacy bridge
        script: |
          #!/bin/bash
          set -euo pipefail
          chmod +x scripts/ci/build_admob_plugin.sh
          scripts/ci/build_admob_plugin.sh
          for variant in debug release; do
            LIBRARY="ios/plugins/AdmobPlugin.$variant.xcframework/ios-arm64/AdmobPlugin.a"
            test -f "$LIBRARY"
            BRIDGE_STRINGS="$(mktemp)"
            strings "$LIBRARY" > "$BRIDGE_STRINGS"
            grep -Fxq 'privacy_options_form_dismissed' "$BRIDGE_STRINGS"
            grep -Fxq 'get_privacy_options_requirement_status' "$BRIDGE_STRINGS"
            grep -Fxq 'present_privacy_options_form' "$BRIDGE_STRINGS"
            grep -Fxq 'can_request_ads' "$BRIDGE_STRINGS"
            rm -f "$BRIDGE_STRINGS"
          done
          echo "ADMOB_UMP_NATIVE_BRIDGE_OK version=$ADMOB_PLUGIN_VERSION gma=$GOOGLE_MOBILE_ADS_VERSION godot=$GODOT_VERSION"

      - name: Build matching StoreKit 2 iOS plugin
        script: |
          #!/bin/bash
          set -euo pipefail
          chmod +x scripts/ci/build_storekit2_plugin.sh
          scripts/ci/build_storekit2_plugin.sh
          test -f ios/plugins/godot-storekit2/godot-storekit2.gdip
          test -d ios/plugins/godot-storekit2/godot-storekit2.debug.xcframework
          test -d ios/plugins/godot-storekit2/godot-storekit2.release.xcframework
          grep -Fq 'StoreKit.framework' ios/plugins/godot-storekit2/godot-storekit2.gdip
          echo "STOREKIT2_PLUGIN_OK version=$STOREKIT2_VERSION godot=$GODOT_VERSION ios=$IOS_MIN_VERSION compat=$STOREKIT2_COMPAT_REVISION"

      - name: Import project and run regression smoke tests
        script: |
          #!/bin/bash
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --editor --quit

          run_scene_smoke() {
            local scene="$1"
            local marker="$2"
            local log_file
            log_file="$(mktemp)"
            "$GODOT_BIN" --headless --quit-after 3600 --path "$CM_BUILD_DIR" "$scene" 2>&1 | tee "$log_file"
            ! grep -Fq 'SCRIPT ERROR:' "$log_file"
            grep -Fq "$marker" "$log_file"
          }

          run_script_smoke() {
            local script="$1"
            local marker="$2"
            shift 2
            local log_file
            log_file="$(mktemp)"
            "$GODOT_BIN" --headless --quit-after 3600 --path "$CM_BUILD_DIR" --script scripts/smoke_runner.gd -- "$script" "$@" 2>&1 | tee "$log_file"
            ! grep -Fq 'SCRIPT ERROR:' "$log_file"
            grep -Fq "$marker" "$log_file"
          }

          run_scene_smoke res://logic_smoke.tscn SMOKE_OK
          run_scene_smoke res://scripts/glow_series_smoke.tscn GLOW_SERIES_SMOKE_OK
          run_scene_smoke res://scripts/retired_features_smoke.tscn RETIRED_FEATURES_SMOKE_OK
          run_scene_smoke res://scripts/shop_fix_smoke.tscn SHOP_FIX_SMOKE_OK
          run_scene_smoke res://scripts/tutorial_rain_ui_smoke.tscn TUTORIAL_RAIN_UI_SMOKE_OK
          run_scene_smoke res://scripts/first_play_tutorial_smoke.tscn FIRST_PLAY_TUTORIAL_SMOKE_OK
          run_scene_smoke res://scripts/first_old_seed_restart_smoke.tscn FIRST_OLD_SEED_RESTART_SMOKE_OK
          run_scene_smoke res://scripts/story_dev_presets_smoke.tscn STORY_DEV_PRESETS_SMOKE_OK
          run_scene_smoke res://scripts/build_profile_smoke.tscn BUILD_PROFILE_SMOKE_OK
          run_scene_smoke res://scripts/release_gate_smoke.tscn RELEASE_GATE_SMOKE_OK
          run_scene_smoke res://scripts/rewarded_ad_service_smoke.tscn REWARDED_AD_SERVICE_SMOKE_OK
          run_scene_smoke res://scripts/progression_ui_revision_smoke.tscn PROGRESSION_UI_REVISION_SMOKE_OK
          run_scene_smoke res://scripts/catalog_cover_species_smoke.tscn CATALOG_COVER_SPECIES_SMOKE_OK
          run_scene_smoke res://scripts/encyclopedia_card_layout_smoke.tscn ENCYCLOPEDIA_CARD_LAYOUT_SMOKE_OK
          run_scene_smoke res://scripts/collection_complete_smoke.tscn COLLECTION_COMPLETE_SMOKE_OK
          run_scene_smoke res://scripts/carnicolor_first_get_story_smoke.tscn CARNICOLOR_FIRST_GET_STORY_SMOKE_OK
          run_scene_smoke res://scripts/pot_unlock_iap_smoke.tscn POT_UNLOCK_IAP_SMOKE_OK
          run_scene_smoke res://scripts/puku_points_smoke.tscn PUKU_POINTS_SMOKE_OK
          run_scene_smoke res://scripts/best_record_showcase_smoke.tscn BEST_RECORD_SHOWCASE_SMOKE_OK
          run_scene_smoke res://scripts/normal_round_smoke.tscn NORMAL_ROUND_SMOKE_OK
          run_scene_smoke res://scripts/story_guidance_smoke.tscn STORY_GUIDANCE_SMOKE_OK
          run_scene_smoke res://scripts/post_tutorial_habitat_guidance_smoke.tscn POST_TUTORIAL_HABITAT_GUIDANCE_SMOKE_OK
          run_script_smoke res://scripts/dialog_portrait_layout_smoke.gd DIALOG_PORTRAIT_LAYOUT_SMOKE_OK
          run_script_smoke res://scripts/input_response_smoke.gd INPUT_RESPONSE_SMOKE_OK
          run_script_smoke res://scripts/release_polish_b_smoke.gd RELEASE_POLISH_B_SMOKE_OK
          run_scene_smoke res://scripts/story_continue_button_style_smoke.tscn STORY_CONTINUE_BUTTON_STYLE_SMOKE_OK
          run_scene_smoke res://scripts/title_branding_smoke.tscn TITLE_BRANDING_SMOKE_OK
          run_scene_smoke res://scripts/habitat_restoration_smoke.tscn HABITAT_RESTORATION_SMOKE_OK
          run_scene_smoke res://scripts/integrated_features_smoke.tscn INTEGRATED_FEATURES_SMOKE_OK
          run_scene_smoke res://scripts/fusion_system_smoke.tscn FUSION_SYSTEM_SMOKE_OK
          run_scene_smoke res://scripts/forest_gacha_smoke.tscn FOREST_GACHA_SMOKE_OK
          run_scene_smoke res://scripts/species_rarity_smoke.tscn SPECIES_RARITY_SMOKE_OK
          run_script_smoke res://scripts/jelly_dev_smoke.gd JELLY_DEV_SMOKE_OK
          run_script_smoke res://scripts/habitat_revision_smoke.gd HABITAT_REVISION_SMOKE_OK
          run_script_smoke res://scripts/early_game_habitat_smoke.gd EARLY_GAME_HABITAT_SMOKE_OK
          run_script_smoke res://scripts/jurejure_story_smoke.gd JUREJURE_STORY_SMOKE_OK
          run_script_smoke res://scripts/puku_puku_battle_smoke.gd PUKU_PUKU_BATTLE_SMOKE_OK
          run_script_smoke res://scripts/exploitation_first_battle_smoke.gd EXPLOITATION_FIRST_BATTLE_SMOKE_OK
          run_script_smoke res://scripts/normal_seed_distribution_smoke.gd NORMAL_SEED_DISTRIBUTION_SMOKE_OK
          run_script_smoke res://scripts/ios_native_smoke.gd IOS_NATIVE_SMOKE_OK

      - name: Set unique iOS build number
        script: |
          #!/bin/bash
          set -euo pipefail
          IOS_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) echo "PROJECT_BUILD_NUMBER must be numeric" >&2; exit 1 ;;
          esac
          python3 - "$IOS_BUILD_NUMBER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(r'application/version="[^"]*"', f'application/version="{sys.argv[1]}"', text)
          if count < 2:
              raise SystemExit("Unable to set iOS build number in export_presets.cfg")
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "IOS_VERSION_SET version=$APP_VERSION build=$IOS_BUILD_NUMBER"

      - name: Export Godot native iOS Xcode project
        script: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p "$(dirname "$CM_BUILD_DIR/$XCODE_PROJECT")"
          echo "GODOT_IOS_EXPORT_COMMAND_BEGIN preset=$GODOT_IOS_PRESET project=$XCODE_PROJECT"
          set +e
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --export-release "$GODOT_IOS_PRESET" "$CM_BUILD_DIR/$XCODE_PROJECT" 2>&1 \
            | sed -E 's|ca-app-pub-[0-9]{16}[~/][0-9]{10}|[REDACTED_ADMOB_ID]|g'
          export_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${export_pipeline_status[0]}" -ne 0 ]; then
            echo "GODOT_IOS_EXPORT_COMMAND_FAILED status=${export_pipeline_status[0]} preset=$GODOT_IOS_PRESET" >&2
            exit "${export_pipeline_status[0]}"
          fi
          if [ "${export_pipeline_status[1]}" -ne 0 ]; then
            echo "GODOT_IOS_EXPORT_LOG_REDACTION_FAILED status=${export_pipeline_status[1]}" >&2
            exit "${export_pipeline_status[1]}"
          fi
          echo "GODOT_IOS_EXPORT_COMMAND_OK preset=$GODOT_IOS_PRESET project=$XCODE_PROJECT"
          python3 scripts/ci/validate_ios_export.py \
            --xcode-project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --app-dir "$CM_BUILD_DIR/$IOS_APP_DIR" \
            --info-plist "$CM_BUILD_DIR/$IOS_INFO_PLIST" \
            --bundle-id "$BUNDLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --app-version "$APP_VERSION" \
            --build-number "$IOS_BUILD_NUMBER" \
            --display-name "$DISPLAY_NAME" \
            --ios-min-version "$IOS_MIN_VERSION"
          PRIVACY_MANIFEST="$(dirname "$CM_BUILD_DIR/$XCODE_PROJECT")/PrivacyInfo.xcprivacy"
          if ! plutil -lint "$PRIVACY_MANIFEST"; then
            echo "IOS_EXPORT_VALIDATION_FAILED check=privacy_manifest.plutil detail=plutil rejected the generated manifest" >&2
            exit 1
          fi
          echo "IOS_EXPORT_CHECK_OK check=privacy_manifest.plutil"
          EXPORTED_PCK="$CM_BUILD_DIR/${XCODE_PROJECT%.xcodeproj}.pck"
          bash scripts/ci/verify_mobile_ads_export.sh \
            "$GODOT_BIN" \
            "$CM_BUILD_DIR" \
            "$EXPORTED_PCK" \
            "$MOBILE_ADS_MODE"
          echo "IOS_EXPORT_CHECK_OK check=mobile_ads.pack_path layout=xcode_project_sibling"
          echo "GODOT_IOS_EXPORT_OK project=$XCODE_PROJECT"

      - name: Apply App Store distribution signing
        script: |
          #!/bin/bash
          set -euo pipefail
          if [ "$APP_STORE_SUBMISSION" = "true" ]; then
            test "$BUILD_PROFILE" = "app_store"
            test "$INTERNAL_TESTFLIGHT_ONLY" = "false"
            xcode-project use-profiles
          elif [ "$INTERNAL_TESTFLIGHT_ONLY" = "true" ]; then
            test "$BUILD_PROFILE" = "app_store"
            xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
          else
            test "$BUILD_PROFILE" = "development"
            xcode-project use-profiles
          fi
          echo "IOS_SIGNING_APPLIED bundle_id=$BUNDLE_ID team_id=$APPLE_TEAM_ID"

      - name: Archive and build signed IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          IPA_PATH="$(find "$IPA_DIR" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcode-project ipa-info "$IPA_PATH"
          IPA_AUDIT_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$IPA_AUDIT_DIR"
          APP_PATH="$(find "$IPA_AUDIT_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_PCK="$APP_PATH/$XCODE_SCHEME.pck"
          bash scripts/ci/verify_mobile_ads_export.sh \
            "$GODOT_BIN" \
            "$CM_BUILD_DIR" \
            "$SIGNED_PCK" \
            "$MOBILE_ADS_MODE"
          echo "SIGNED_IPA_CHECK_OK check=mobile_ads.pack_path layout=bundle_root"
          python3 - "$APP_PATH" "$BUNDLE_ID" "$DISPLAY_NAME" "$BUILD_PROFILE" "$MOBILE_ADS_MODE" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          expected_bundle, expected_name, profile, ads_mode = sys.argv[2:6]
          with (app / "Info.plist").open("rb") as handle:
              info = plistlib.load(handle)
          if info.get("CFBundleIdentifier") != expected_bundle:
              raise SystemExit("Signed IPA has an unexpected bundle identifier")
          if info.get("CFBundleDisplayName") != expected_name:
              raise SystemExit("Signed IPA has an unexpected display name")
          app_id = str(info.get("GADApplicationIdentifier", ""))
          if not app_id.startswith("ca-app-pub-"):
              raise SystemExit("Signed IPA is missing GADApplicationIdentifier")
          sample_app_id = "ca-app-pub-3940256099942544~1458002511"
          if ads_mode == "production" and app_id == sample_app_id:
              raise SystemExit("Signed production-ad IPA contains Google's sample app ID")
          if ads_mode == "test" and app_id != sample_app_id:
              raise SystemExit("Signed test-ad IPA does not contain Google's sample app ID")
          if ads_mode not in {"production", "test"}:
              raise SystemExit("Signed IPA has an unknown mobile ads mode")
          ats = info.get("NSAppTransportSecurity", {})
          if ats.get("NSAllowsArbitraryLoads"):
              raise SystemExit("Signed IPA disables ATS globally")
          if not ats.get("NSAllowsArbitraryLoadsForMedia") or not ats.get("NSAllowsArbitraryLoadsInWebContent"):
              raise SystemExit("Signed IPA is missing scoped Google Mobile Ads ATS exceptions")
          if "NSUserTrackingUsageDescription" in info:
              raise SystemExit("ATT is disabled but the signed IPA contains NSUserTrackingUsageDescription")

          privacy_path = app / "PrivacyInfo.xcprivacy"
          with privacy_path.open("rb") as handle:
              privacy = plistlib.load(handle)
          reasons = {
              item.get("NSPrivacyAccessedAPIType"): set(item.get("NSPrivacyAccessedAPITypeReasons", []))
              for item in privacy.get("NSPrivacyAccessedAPITypes", [])
          }
          required = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": "C617.1",
              "NSPrivacyAccessedAPICategorySystemBootTime": "35F9.1",
              "NSPrivacyAccessedAPICategoryDiskSpace": "E174.1",
              "NSPrivacyAccessedAPICategoryUserDefaults": "CA92.1",
          }
          for category, reason in required.items():
              if reason not in reasons.get(category, set()):
                  raise SystemExit(f"Missing privacy reason {category}/{reason}")
          sdk_manifests = [path for path in app.rglob("PrivacyInfo.xcprivacy") if path != privacy_path]
          if not any("GoogleMobileAds" in str(path) for path in sdk_manifests):
              raise SystemExit("Google Mobile Ads privacy manifest is missing from the signed IPA")
          print(f"SIGNED_IPA_AUDIT_OK bundle={expected_bundle} ads_mode={ads_mode} privacy_manifests={1 + len(sdk_manifests)}")
          PY
          echo "IOS_IPA_OK path=$IPA_PATH version=$APP_VERSION build=$IOS_BUILD_NUMBER"

      - name: Record iOS build diagnostics
        script: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p build/ios-diagnostics
          printf '{"profile":"%s","ads_mode":"%s","bundle_id":"%s","team_id":"%s","version":"%s","build":"%s"}\n' \
            "$BUILD_PROFILE" "$MOBILE_ADS_MODE" "$BUNDLE_ID" "$APPLE_TEAM_ID" "$APP_VERSION" "$IOS_BUILD_NUMBER" \
            > "build/ios-diagnostics/$BUILD_PROFILE-app.json"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios-diagnostics/*.json
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

